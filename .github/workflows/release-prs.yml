name: Release PR

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled

jobs:
  build:
    # We want to build artifacts only if the `upload artifacts` label is applied.
    # Only intra-repo PRs are allowed to have PR artifacts uploaded.
    # We only want to trigger once the label is added, not when any label is added.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository
      && (
        (github.event.action == 'labeled' && github.event.label.name == 'upload artifacts')
        || (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'upload artifacts'))
      )
    uses: ./.github/workflows/build.yaml

  release:
    needs: build
    concurrency: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create the artifacts directory
        run: rm -rf ./artifacts && mkdir ./artifacts

      - uses: actions/download-artifact@v4.1.8
        with:
          name: magic-nix-cache-ARM64-macOS
          path: cache-binary-ARM64-macOS
      - name: Persist the cache binary
        run: cp ./cache-binary-ARM64-macOS/magic-nix-cache.closure.xz ./artifacts/ARM64-macOS

      - uses: actions/download-artifact@v4.1.8
        with:
          name: magic-nix-cache-X64-Linux
          path: cache-binary-X64-Linux
      - name: Persist the cache binary
        run: cp ./cache-binary-X64-Linux/magic-nix-cache.closure.xz ./artifacts/X64-Linux

      - uses: actions/download-artifact@v4.1.8
        with:
          name: magic-nix-cache-ARM64-Linux
          path: cache-binary-ARM64-Linux
      - name: Persist the cache binary
        run: cp ./cache-binary-ARM64-Linux/magic-nix-cache.closure.xz ./artifacts/ARM64-Linux

      - name: Upload PR artifact bundle
        uses: actions/upload-artifact@v4.6.0
        with:
          name: magic-nix-cache-closures
          path: artifacts/**
